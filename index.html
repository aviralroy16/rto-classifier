<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTO Risk Predictor — AI Logistics Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #0b0f19; --card-bg: rgba(17, 24, 39, 0.7); --border-color: rgba(255, 255, 255, 0.1); --accent-cyan: #06b6d4; --accent-purple: #8b5cf6; --text-main: #f3f4f6; --text-muted: #9ca3af; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding: 2rem; }
        nav { display: flex; justify-content: space-between; align-items: center; max-width: 1000px; margin: 0 auto 3rem auto; padding: 1rem 2rem; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; backdrop-filter: blur(12px); }
        .logo { font-size: 1.25rem; font-weight: 800; color: #fff; }
        .logo span { color: var(--accent-cyan); }
        .status-badge { font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; padding: 0.4rem 0.8rem; border-radius: 20px; background: rgba(6, 182, 212, 0.1); border: 1px solid rgba(6, 182, 212, 0.3); color: var(--accent-cyan); }
        .container { max-width: 1000px; margin: 0 auto; }
        .hero { text-align: center; margin-bottom: 3rem; }
        .hero h1 { font-size: 2.8rem; font-weight: 800; margin-bottom: 1rem; line-height: 1.2; }
        .hero h1 span { background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 2.5rem; backdrop-filter: blur(16px); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
        .input-group { display: flex; flex-direction: column; gap: 0.5rem; }
        label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
        input, select, textarea { background: rgba(0, 0, 0, 0.4); border: 1px solid var(--border-color); border-radius: 10px; padding: 0.85rem 1rem; color: #fff; font-size: 1rem; }
        textarea { resize: vertical; grid-column: span 2; }
        .btn-primary { background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple)); color: white; border: none; padding: 1rem 2rem; border-radius: 10px; font-weight: 700; width: 100%; cursor: pointer; }
        .output-box { margin-top: 2rem; background: rgba(0, 0, 0, 0.6); border: 1px solid var(--border-color); border-radius: 14px; padding: 1.5rem; }
        .result-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .tag { font-family: 'JetBrains Mono', monospace; font-weight: 600; padding: 0.3rem 0.8rem; border-radius: 6px; background: rgba(6, 182, 212, 0.15); color: var(--accent-cyan); }
        .status-text { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: var(--text-muted); text-align: center; margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <div class="logo">⚡ RTO<span>Predict</span> Engine</div>
            <div id="backendStatus" class="status-badge">Checking Backend...</div>
        </nav>
        <div class="card">
            <div class="form-grid">
                <div class="input-group"><label>Order ID</label><input type="text" id="orderId" value="ORD-1001"></div>
                <div class="input-group"><label>Order Amount (₹)</label><input type="number" id="orderAmount" value="1499"></div>
                <div class="input-group"><label>Payment Method</label><select id="paymentMethod"><option value="COD">COD</option><option value="Prepaid">Prepaid</option></select></div>
                <div class="input-group"><label>Pincode</label><input type="number" id="pincode" value="110001"></div>
                <div class="input-group" style="grid-column: span 2;"><label>Shipping Address</label><textarea id="shippingAddress" rows="2">Flat 202 near shiv mandir main road</textarea></div>
            </div>
            <button class="btn-primary" onclick="sendPredictionRequest()">Run ML Model Prediction</button>
            <div id="apiStatus" class="status-text">Status: Ready</div>
            <div class="output-box">
                <div class="result-row"><span style="color: var(--text-muted);">Risk Probability:</span><span id="resProb" class="tag">--</span></div>
                <div class="result-row"><span style="color: var(--text-muted);">Risk Band:</span><span id="resBand" style="font-weight: 700; font-family: 'JetBrains Mono', monospace;">--</span></div>
                <div class="result-row"><span style="color: var(--text-muted);">Triggered Action:</span><span id="resAction" style="color: #fff; font-family: 'JetBrains Mono', monospace;">--</span></div>
            </div>
        </div>
    </div>
    <script>
        window.onload = async function() {
            const badge = document.getElementById('backendStatus');
            try {
                const res = await fetch('https://rto-classifier.onrender.com/');
                if(res.ok) {
                    badge.textContent = "Backend Online ✓";
                    badge.style.color = "#27c93f"; badge.style.borderColor = "rgba(39, 201, 63, 0.3)"; badge.style.background = "rgba(39, 201, 63, 0.1)";
                }
            } catch(e) {
                badge.textContent = "Backend Offline ✕";
                badge.style.color = "#ff5f56"; badge.style.borderColor = "rgba(255, 95, 86, 0.3)"; badge.style.background = "rgba(255, 95, 86, 0.1)";
            }
        };
        async function sendPredictionRequest() {
            const statusEl = document.getElementById('apiStatus');
            const probEl = document.getElementById('resProb');
            const bandEl = document.getElementById('resBand');
            const actionEl = document.getElementById('resAction');
            const payload = {
                order_id: document.getElementById('orderId').value,
                order_amount: parseFloat(document.getElementById('orderAmount').value),
                payment_method: document.getElementById('paymentMethod').value,
                shipping_pincode: parseInt(document.getElementById('pincode').value),
                shipping_address: document.getElementById('shippingAddress').value,
                order_hour: new Date().getHours()
            };
            statusEl.textContent = "Status: Sending payload...";
            try {
                const response = await fetch('https://rto-classifier.onrender.com/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const data = await response.json();
                statusEl.textContent = "Status: Prediction received successfully ✓";
                probEl.textContent = `${(data.rto_probability * 100).toFixed(1)}%`;
                bandEl.textContent = data.risk_band;
                actionEl.textContent = data.action;
                if (data.risk_band === 'HIGH') bandEl.style.color = '#ff5f56';
                else if (data.risk_band === 'MEDIUM') bandEl.style.color = '#ffbd2e';
                else bandEl.style.color = '#27c93f';
            } catch (error) {
                statusEl.textContent = "Status: Connection Failed.";
                alert("Could not reach server. If Render is waking up, wait 30 seconds and retry!");
            }
        }
    </script>
</body>
</html>
